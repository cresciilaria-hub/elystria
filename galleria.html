<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galleria — Elystria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --nero:#0a0810;--oro:#e6c068;--oro-chiaro:#f8e4b0;--oro-scuro:#9c7a32;
    --fiamma:#ffce4d;--testo:#f0ead8;--testo-soft:#c4baa4;--bordo:rgba(230,192,104,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--nero);color:var(--testo);font-family:'Cormorant Garamond',serif;font-size:24px;overflow-x:hidden;line-height:1.6}

  header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 42px;transition:all .4s ease}
  header.scrolled{background:rgba(10,8,16,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bordo);padding:12px 42px}
  .brand{display:flex;align-items:center;text-decoration:none}
  .brand img{height:46px;width:auto;display:block;filter:drop-shadow(0 2px 12px rgba(230,192,104,0.35));transition:height .4s ease}
  header.scrolled .brand img{height:38px}
  nav{display:flex;align-items:center;gap:6px}
  nav a,.dropdown-btn{font-family:'Cinzel',serif;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--testo-soft);text-decoration:none;padding:10px 14px;background:none;border:none;cursor:pointer;position:relative;transition:color .3s}
  nav a:hover,.dropdown-btn:hover,nav a.active{color:var(--oro-chiaro)}
  nav a::after{content:'';position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--oro);transform:scaleX(0);transition:transform .3s}
  nav a:hover::after,nav a.active::after{transform:scaleX(1)}
  .dropdown{position:relative}
  .dropdown-btn.active-page{color:var(--oro-chiaro)}
  .dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(13,11,20,0.98);border:1px solid var(--bordo);border-radius:4px;min-width:190px;padding:8px 0;opacity:0;visibility:hidden;transition:all .3s;box-shadow:0 20px 50px rgba(0,0,0,0.6)}
  .dropdown:hover .dropdown-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(4px)}
  .dropdown-menu a{display:block;padding:10px 22px;text-align:left}
  .dropdown-menu a::after{display:none}
  .dropdown-menu a:hover{background:rgba(230,192,104,0.08)}
  .dropdown-menu a.active{color:var(--oro-chiaro)}
  .lang{display:flex;gap:2px;margin-left:14px;border:1px solid var(--bordo);border-radius:3px;overflow:hidden}
  .lang button{font-family:'Cinzel',serif;font-size:.95rem;letter-spacing:.1em;background:none;border:none;color:var(--testo-soft);padding:7px 11px;cursor:pointer;transition:all .25s}
  .lang button.active{background:var(--oro);color:var(--nero);font-weight:700}
  .burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px}
  .burger span{width:26px;height:2px;background:var(--oro-chiaro);transition:.3s}

  .page-hero{position:relative;padding:160px 24px 50px;text-align:center;overflow:hidden}
  .page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(230,192,104,0.1),transparent 70%)}
  .page-hero-inner{position:relative;z-index:2}
  .page-kicker{font-family:'Cinzel',serif;font-size:1.05rem;letter-spacing:.45em;text-transform:uppercase;color:var(--oro-chiaro);margin-bottom:18px;opacity:0;animation:fadeUp 1s ease .2s forwards}
  .page-title{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(2.6rem,7vw,5rem);color:var(--oro-chiaro);letter-spacing:.04em;text-shadow:0 0 50px rgba(255,206,77,0.4);opacity:0;animation:fadeUp 1s ease .4s forwards}
  .page-subtitle{font-style:italic;font-size:clamp(1.5rem,3vw,2.1rem);color:var(--testo);margin-top:18px;opacity:0;animation:fadeUp 1s ease .6s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

  /* GALLERIA masonry */
  .gallery{column-count:3;column-gap:18px;max-width:1200px;margin:40px auto 60px;padding:0 32px}
  .gphoto{position:relative;break-inside:avoid;margin-bottom:18px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--bordo);opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}
  .gphoto.visible{opacity:1;transform:translateY(0)}
  .gphoto img{width:100%;display:block;transition:transform 1s ease}
  .gphoto:hover img{transform:scale(1.06)}
  .gphoto::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(10,8,16,0.85));opacity:0;transition:opacity .4s}
  .gphoto:hover::after{opacity:1}
  .gcap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;z-index:2;font-family:'Cinzel',serif;font-size:1.15rem;color:var(--oro-chiaro);opacity:0;transform:translateY(10px);transition:all .4s}
  .gphoto:hover .gcap{opacity:1;transform:translateY(0)}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(5,4,9,0.94);display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;visibility:hidden;transition:opacity .35s}
  .lightbox.open{opacity:1;visibility:visible}
  .lightbox img{max-width:90vw;max-height:82vh;border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,0.8);transform:scale(.94);transition:transform .35s}
  .lightbox.open img{transform:scale(1)}
  .lb-cap{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-size:1.3rem;color:var(--oro-chiaro);letter-spacing:.05em}
  .lb-close{position:absolute;top:24px;right:30px;width:52px;height:52px;border-radius:50%;background:rgba(10,8,16,0.7);border:1px solid var(--bordo);color:var(--oro-chiaro);font-size:1.9rem;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .25s}
  .lb-close:hover{background:var(--oro);color:var(--nero);transform:rotate(90deg)}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:rgba(10,8,16,0.6);border:1px solid var(--bordo);color:var(--oro-chiaro);font-size:1.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s}
  .lb-nav:hover{background:var(--oro);color:var(--nero)}
  .lb-prev{left:24px}.lb-next{right:24px}

  footer{position:relative;z-index:2;border-top:1px solid var(--bordo);padding:50px 24px 40px;text-align:center;background:rgba(10,8,16,0.7)}
  footer .f-title{font-family:'Cinzel',serif;font-size:1.1rem;letter-spacing:.2em;color:var(--oro);margin-bottom:12px}
  footer p{font-size:1.3rem;color:var(--testo-soft);margin:4px 0}

  @media(max-width:980px){.gallery{column-count:2}}
  @media(max-width:880px){
    header{padding:14px 20px}
    nav{position:fixed;top:0;right:-100%;width:78%;max-width:340px;height:100vh;flex-direction:column;align-items:flex-start;gap:0;background:rgba(10,9,16,0.99);backdrop-filter:blur(16px);padding:90px 30px 30px;transition:right .4s ease;border-left:1px solid var(--bordo);overflow-y:auto}
    nav.open{right:0}
    nav a,.dropdown-btn{width:100%;padding:14px 0;font-size:.95rem}
    .dropdown{width:100%}
    .dropdown-menu{position:static;transform:none;opacity:1;visibility:visible;background:rgba(255,255,255,0.02);border:none;box-shadow:none;max-height:0;overflow:hidden;transition:max-height .3s;padding:0}
    .dropdown.open-mob .dropdown-menu{max-height:300px;padding:4px 0}
    .lang{margin:20px 0 0 0}
    .burger{display:flex;z-index:101}
    .lb-nav{width:44px;height:44px}
  }
  @media(max-width:600px){.gallery{column-count:1;max-width:420px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header id="header">
  <a href="index.html" class="brand"><img src="assets/logo.png" alt="Elystria"></a>
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  <nav id="nav">
    <a href="index.html" data-it="Home" data-en="Home">Home</a>
    <a href="team.html" data-it="Il Team" data-en="The Team">Il Team</a>
    <a href="progetto.html" data-it="Il Progetto" data-en="The Project">Il Progetto</a>
    <a href="storia.html" data-it="Storia" data-en="Story">Storia</a>
    <div class="dropdown" id="dropGioco">
      <button class="dropdown-btn active-page" data-it="Il Gioco ▾" data-en="The Game ▾">Il Gioco ▾</button>
      <div class="dropdown-menu">
        <a href="personaggi.html" data-it="Personaggi" data-en="Characters">Personaggi</a>
        <a href="regni.html" data-it="I Regni" data-en="The Realms">I Regni</a>
        <a href="meccaniche.html" data-it="Meccaniche" data-en="Mechanics">Meccaniche</a>
        <a href="galleria.html" class="active" data-it="Galleria" data-en="Gallery">Galleria</a>
      </div>
    </div>
    <a href="timeline.html" data-it="Timeline" data-en="Timeline">Timeline</a>
    <div class="lang">
      <button id="lang-it" class="active" onclick="setLang('it')">IT</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
  </nav>
</header>

<section class="page-hero">
  <div class="page-hero-inner">
    <div class="page-kicker" data-it="L'arte di Elystria" data-en="The art of Elystria">L'arte di Elystria</div>
    <h1 class="page-title" data-it="Galleria" data-en="Gallery">Galleria</h1>
    <p class="page-subtitle" data-it="Personaggi, ambientazioni e atmosfere del nostro mondo" data-en="Characters, environments and atmospheres of our world">Personaggi, ambientazioni e atmosfere del nostro mondo</p>
  </div>
</section>

<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Chiudi">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Precedente">‹</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Successiva">›</button>
</div>

<footer>
  <div class="f-title">ELYSTRIA — La Fiamma Primordiale</div>
  <p data-it="CFP G. Zanardelli — Anno scolastico 2025/2026" data-en="CFP G. Zanardelli — School year 2025/2026">CFP G. Zanardelli — Anno scolastico 2025/2026</p>
  <p data-it="Progetto realizzato da Ilaria, Martina e Jolanda" data-en="Project created by Ilaria, Martina and Jolanda">Progetto realizzato da Ilaria, Martina e Jolanda</p>
</footer>

<script>
  const photos=[
    {src:"assets/img/keyart.jpg",cap:{it:"Key Art — Elystria",en:"Key Art — Elystria"}},
    {src:"assets/img/ophelia_theron.jpg",cap:{it:"Ophelia e Theron",en:"Ophelia and Theron"}},
    {src:"assets/img/theron3.jpg",cap:{it:"Theron, il Prediletto",en:"Theron, the Chosen One"}},
    {src:"assets/img/ophelia.jpg",cap:{it:"Ophelia, Dea della Saggezza",en:"Ophelia, Goddess of Wisdom"}},
    {src:"assets/img/zython.jpg",cap:{it:"Zython, il Primo Divoratore",en:"Zython, the First Devourer"}},
    {src:"assets/img/gairok.jpg",cap:{it:"Gairok, Dio della Terra",en:"Gairok, God of Earth"}},
    {src:"assets/img/azione.jpg",cap:{it:"Scena di combattimento",en:"Combat scene"}},
    {src:"assets/img/spade.jpg",cap:{it:"La Spada della Fiamma",en:"The Flame Sword"}},
    {src:"assets/img/amb_tempio.jpg",cap:{it:"Il Tempio Sommerso",en:"The Sunken Temple"}},
    {src:"assets/img/amb_vulcano.jpg",cap:{it:"Il Vulcano del Cuore Fuso",en:"The Volcano of the Molten Heart"}},
    {src:"assets/img/amb_foresta.jpg",cap:{it:"La Foresta Distorta",en:"The Distorted Forest"}},
    {src:"assets/img/amb_santuario.jpg",cap:{it:"Il Santuario Sospeso",en:"The Suspended Sanctuary"}},
    {src:"assets/img/amb_tempio2.jpg",cap:{it:"Tempio Sommerso — veduta",en:"Sunken Temple — view"}},
    {src:"assets/img/amb_vulcano2.jpg",cap:{it:"Vulcano — veduta",en:"Volcano — view"}},
    {src:"assets/img/amb_foresta2.jpg",cap:{it:"Foresta — veduta",en:"Forest — view"}},
    {src:"assets/img/amb_santuario2.jpg",cap:{it:"Santuario — veduta",en:"Sanctuary — view"}}
  ];

  let currentLang='it', currentIdx=0;
  function renderGallery(){
    const g=document.getElementById('gallery');
    g.innerHTML=photos.map((p,i)=>`<div class="gphoto" data-i="${i}"><img src="${p.src}" alt="${p.cap[currentLang]}" loading="lazy"><div class="gcap">${p.cap[currentLang]}</div></div>`).join('');
    document.querySelectorAll('.gphoto').forEach(el=>{
      el.addEventListener('click',()=>openLb(parseInt(el.dataset.i)));
    });
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.1});
    document.querySelectorAll('.gphoto').forEach(el=>io.observe(el));
  }
  function openLb(i){
    currentIdx=i;
    document.getElementById('lbImg').src=photos[i].src;
    document.getElementById('lbCap').textContent=photos[i].cap[currentLang];
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeLb(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
  function nav(dir){currentIdx=(currentIdx+dir+photos.length)%photos.length;openLb(currentIdx);}
  document.getElementById('lbClose').addEventListener('click',closeLb);
  document.getElementById('lbPrev').addEventListener('click',e=>{e.stopPropagation();nav(-1)});
  document.getElementById('lbNext').addEventListener('click',e=>{e.stopPropagation();nav(1)});
  document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLb()});
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('lightbox').classList.contains('open'))return;
    if(e.key==='Escape')closeLb();
    if(e.key==='ArrowLeft')nav(-1);
    if(e.key==='ArrowRight')nav(1);
  });

  function setLang(lang){
    currentLang=lang;
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-it]').forEach(el=>{const t=el.getAttribute('data-'+lang);if(t!==null)el.innerHTML=t});
    document.getElementById('lang-it').classList.toggle('active',lang==='it');
    document.getElementById('lang-en').classList.toggle('active',lang==='en');
    renderGallery();
  }

  const header=document.getElementById('header');
  window.addEventListener('scroll',()=>header.classList.toggle('scrolled',window.scrollY>40));
  const burger=document.getElementById('burger'),nav2=document.getElementById('nav');
  burger.addEventListener('click',()=>nav2.classList.toggle('open'));
  document.getElementById('dropGioco').querySelector('.dropdown-btn').addEventListener('click',e=>{if(window.innerWidth<=880){e.preventDefault();document.getElementById('dropGioco').classList.toggle('open-mob')}});

  renderGallery();
</script>
</body>
</html>
